name: build

on:
  push:
    branches: [ main, VLote ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore .\AS_FBX-reader.sln
      - name: Build
        run: dotnet build .\AS_FBX-reader.sln -c Release --no-restore
      - name: VLote folder-sorting smoke tests
        if: github.ref == 'refs/heads/VLote'
        run: dotnet run --project .\tests\VLoteSmoke\VLoteSmoke.csproj -c Release
      - name: Upload VLote Windows build
        if: github.ref == 'refs/heads/VLote'
        uses: actions/upload-artifact@v4
        with:
          name: AS_FBX-reader-VLote-1.1.1-Windows
          path: src/AS.FBXReader/bin/Release/net9.0-windows/
          if-no-files-found: error
