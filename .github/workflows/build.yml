name: build

on:
  push:
    branches: [ main, '3D' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore .\AS_FBX-reader.sln
      - name: Build
        run: dotnet build .\AS_FBX-reader.sln -c Release --no-restore
      - name: Upload Windows 3D preview
        if: github.ref == 'refs/heads/3D'
        uses: actions/upload-artifact@v4
        with:
          name: AS_FBX-reader-3D-Windows
          path: src/AS.FBXReader/bin/Release/net9.0-windows/
          if-no-files-found: error
